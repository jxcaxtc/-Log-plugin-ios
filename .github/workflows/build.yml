name: Build Dylib

# 触发条件：push 到 main/master 分支，或手动触发
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Test.dylib
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          set -e
          # 克隆 Theos 到固定目录
          export THEOS="$HOME/theos"
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          # 下载 iOS SDK（14.5，来自 theos/sdks releases，单文件 tar.xz，稳定可靠）
          # 部署目标为 iOS 12.0，14.5 SDK 完全满足需求
          mkdir -p "$THEOS/sdks"
          curl -L --fail "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS14.5.sdk.tar.xz" -o /tmp/sdk.tar.xz
          tar -xf /tmp/sdk.tar.xz -C "$THEOS/sdks"
          ls "$THEOS/sdks"

      - name: Install ldid
        run: |
          # Theos 在链接后需要 ldid 对 dylib 签名
          brew install theosos/tap/ldid || brew install ldid

      - name: Build dylib
        run: |
          export THEOS="$HOME/theos"
          export PATH="$THEOS/bin:$PATH"
          make clean
          make

      - name: Show output
        run: |
          find . -name "*.dylib" -type f | head -20
          ls -la .theos/obj/ 2>/dev/null || true

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: Test.dylib
          path: |
            .theos/obj/debug/Test.dylib
            .theos/obj/Test.dylib
          if-no-files-found: warn
