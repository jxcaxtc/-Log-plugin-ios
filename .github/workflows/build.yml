name: Build Dylib

# 触发条件：push 到 main/master 分支，或手动触发
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Test.dylib
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Theos
        run: |
          set -e
          # 克隆 Theos 到固定目录
          export THEOS="$HOME/theos"
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          # 下载 iOS SDK（14.5，来自 theos/sdks releases，单文件 tar.xz，稳定可靠）
          # 部署目标为 iOS 12.0，14.5 SDK 完全满足需求
          mkdir -p "$THEOS/sdks"
          curl -L --fail "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS14.5.sdk.tar.xz" -o /tmp/sdk.tar.xz
          tar -xf /tmp/sdk.tar.xz -C "$THEOS/sdks"
          ls "$THEOS/sdks"

      - name: Provide ldid (best effort, stub fallback)
        run: |
          # Theos 链接后硬调 ldid 给 dylib 签名。先尝试 brew / curl 安装真实 ldid，
          # 失败则用一个 stub 脚本占位（越狱机上的 libhooker / CydiaSubstrate 不校验签名）
          if brew install ldid 2>/dev/null; then
            echo "brew ldid installed"
          elif command -v ldid >/dev/null 2>&1; then
            echo "ldid already exists: $(which ldid)"
          else
            echo "ldid not found — creating a no-op stub"
            cat > /usr/local/bin/ldid <<'EOF'
#!/bin/bash
# ldid stub — does nothing, just exits 0
exit 0
EOF
            chmod +x /usr/local/bin/ldid
          fi
          echo "ldid path: $(which ldid)"
          ldid --version 2>&1 || true

      - name: Build dylib
        run: |
          export THEOS="$HOME/theos"
          export PATH="/usr/local/bin:$THEOS/bin:$PATH"
          make clean
          make

      - name: Show output
        run: |
          find . -name "*.dylib" -type f | head -20
          ls -la .theos/obj/ 2>/dev/null || true

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v5
        with:
          name: Test.dylib
          path: |
            .theos/obj/debug/Test.dylib
            .theos/obj/Test.dylib
          if-no-files-found: warn
